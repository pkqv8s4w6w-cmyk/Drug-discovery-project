[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veridian"
version = "0.1.0"
description = "Structure-based discovery of non-hallucinogenic 5-HT2A agonists"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "typer>=0.9",
    "rdkit>=2023.9",
    "scikit-learn>=1.3",
    "lightgbm>=4.1",
    "scipy>=1.11",
    "jinja2>=3.1",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dock = ["meeko>=0.5", "prolif>=2.0", "MDAnalysis>=2.7", "spyrmsd>=0.6", "py3Dmol>=2.0"]
dev  = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.3", "mypy>=1.8", "mapie>=0.8"]

[project.scripts]
veridian = "veridian.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
# N803/N806: `X` for a feature matrix is the universal ML convention; renaming it to
# `x` would be less readable, not more.
ignore = ["A002", "A003", "N803", "N806"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: requires docking binaries or network",
    "gate: part of the pre-registered gate evaluation",
]
